name: MiniChat
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "16.0"
targets:
  MiniChat:
    type: application
    platform: iOS
    sources: [MiniChat]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.minichat
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: MiniChat
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
